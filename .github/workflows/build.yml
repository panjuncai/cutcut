name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.6.1'
  APP_NAME: 'CutCut'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          arch: clang_64
          cache: true

      - name: Configure arm64
        run: cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build arm64
        run: cmake --build build-arm64 --config Release

      - name: Configure x86_64
        run: cmake -S . -B build-x86 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build x86_64
        run: cmake --build build-x86 --config Release

      - name: Create universal binary
        run: |
          mkdir -p dist build-universal
          lipo -create build-arm64/cutcut build-x86/cutcut -output build-universal/cutcut
          chmod +x build-universal/cutcut

      - name: Create app bundle
        run: |
          APP="dist/${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build-universal/cutcut "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          cat <<PLIST > "$APP/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>${{ env.APP_NAME }}</string>
            <key>CFBundleIdentifier</key>
            <string>com.cutcut.app</string>
            <key>CFBundleName</key>
            <string>CutCut</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSUIElement</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Create DMG
        run: macdeployqt "dist/${{ env.APP_NAME }}.app" -dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutcut-macos
          path: dist/CutCut.dmg

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2019_64
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install tools
        run: choco install ninja --no-progress

      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release --dir artifacts\windows\payload build\cutcut.exe
          Copy-Item build\cutcut.exe artifacts\windows\payload\
          Compress-Archive -Path artifacts\windows\payload\* -DestinationPath artifacts\windows\CutCut-portable.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutcut-windows
          path: artifacts/windows/CutCut-portable.zip

  release:
    runs-on: ubuntu-latest
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cutcut-macos
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cutcut-windows
          path: release/windows

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/macos/CutCut.dmg
            release/windows/CutCut-portable.zip
